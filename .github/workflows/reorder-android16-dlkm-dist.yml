name: Reorder Android 16 system_dlkm dist build

on:
  push:
    branches:
      - fix/android16-system-dlkm-compat

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/android16-system-dlkm-compat
          fetch-depth: 0
      - name: Generate corrected workflow blob
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/reorder_android16_dlkm_dist.py
          cp .github/workflows/build.yml .github/build.android16-dlkm.reordered.yml
          git checkout -- .github/workflows/build.yml
      - name: Publish generated blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build.android16-dlkm.reordered.yml
          git commit -m "ci: publish reordered Android 16 build workflow blob"
          git push origin HEAD:fix/android16-system-dlkm-compat

# one-shot helper
