name: Apply Android 16 system_dlkm compatibility fix

on:
  push:
    branches:
      - fix/android16-system-dlkm-compat

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: fix/android16-system-dlkm-compat
          fetch-depth: 0

      - name: Patch shared build workflow
        run: python3 .github/scripts/apply_android16_dlkm_fix.py

      - name: Commit patched workflow and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-android16-dlkm-fix.yml
          git rm .github/scripts/apply_android16_dlkm_fix.py
          git add .github/workflows/build.yml
          git commit -m "build: add Android 16 system_dlkm compatibility modes"
          git push origin HEAD:fix/android16-system-dlkm-compat

# one-shot patch runner; this file removes itself after a successful run
