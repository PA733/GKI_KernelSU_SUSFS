name: Apply Android 16 system_dlkm compatibility fix

on:
  push:
    branches:
      - fix/android16-system-dlkm-compat

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: fix/android16-system-dlkm-compat
          fetch-depth: 0

      - name: Generate patched build workflow blob
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_android16_dlkm_fix.py
          cp .github/workflows/build.yml .github/build.android16-dlkm.generated.yml
          git checkout -- .github/workflows/build.yml

      - name: Publish temporary generated blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build.android16-dlkm.generated.yml
          git commit -m "ci: publish generated Android 16 build workflow blob"
          git push origin HEAD:fix/android16-system-dlkm-compat
