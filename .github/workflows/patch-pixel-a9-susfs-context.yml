name: Patch Pixel A9 SUSFS context

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/scripts/patch-pixel-a9-susfs-context.py'
      - '.github/workflows/patch-pixel-a9-susfs-context.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/pixel-a9-susfs-task-mmu-context'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply focused workflow patch
        run: |
          python3 .github/scripts/patch-pixel-a9-susfs-context.py
          git diff --check
          git diff -- .github/workflows/build.yml
      - name: Create cleaned commit
        run: |
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          rm -f .github/scripts/patch-pixel-a9-susfs-context.py
          rm -f .github/workflows/patch-pixel-a9-susfs-context.yml
          git add .github/workflows/build.yml .github/scripts/patch-pixel-a9-susfs-context.py .github/workflows/patch-pixel-a9-susfs-context.yml
          git commit -m "build: adapt SUSFS task_mmu context for Pixel A9"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Attempt push
        run: |
          echo "Generated commit: $GENERATED_COMMIT"
          git push origin HEAD:fix/pixel-a9-susfs-task-mmu-context
