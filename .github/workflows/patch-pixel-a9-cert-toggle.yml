name: Patch Pixel A9 certificate toggle

on:
  push:
    branches:
      - fix/pixel-a9-stock-cert-toggle
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/pixel-a9-stock-cert-toggle' || github.ref == 'refs/heads/fix/pixel-a9-stock-cert-toggle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pixel-a9-stock-cert-toggle
          fetch-depth: 0
      - name: Apply focused certificate toggle patch
        run: |
          python3 .github/scripts/patch-pixel-a9-cert-toggle.py
          git diff --check
          git diff -- .github/workflows/build.yml .github/workflows/kernel-a16-6-12-pixel-a9.yml
      - name: Create cleaned commit
        run: |
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          rm -f .github/scripts/patch-pixel-a9-cert-toggle.py
          rm -f .github/workflows/patch-pixel-a9-cert-toggle.yml
          git add .github/workflows/build.yml .github/workflows/kernel-a16-6-12-pixel-a9.yml .github/scripts/patch-pixel-a9-cert-toggle.py .github/workflows/patch-pixel-a9-cert-toggle.yml
          git commit -m "test: make Pixel A9 stock GKI certificate optional"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Attempt push
        run: |
          echo "Generated commit: $GENERATED_COMMIT"
          git push origin HEAD:fix/pixel-a9-stock-cert-toggle
