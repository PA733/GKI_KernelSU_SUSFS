name: Patch Pixel A9 public KMI diagnostic result

on:
  push:
    branches:
      - fix/pixel-a9-public-kmi-diagnostic-result
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/pixel-a9-public-kmi-diagnostic-result' || github.ref == 'refs/heads/fix/pixel-a9-public-kmi-diagnostic-result'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pixel-a9-public-kmi-diagnostic-result
          fetch-depth: 0
      - name: Apply focused diagnostic result handling
        run: |
          python3 .github/scripts/patch-public-kmi-diagnostic-result.py
          git diff --check
          git diff -- .github/workflows/build.yml
      - name: Create cleaned commit
        run: |
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          rm -f .github/scripts/patch-public-kmi-diagnostic-result.py
          rm -f .github/workflows/patch-public-kmi-diagnostic-result.yml
          git add .github/workflows/build.yml .github/scripts/patch-public-kmi-diagnostic-result.py .github/workflows/patch-public-kmi-diagnostic-result.yml
          git commit -m "test: report public KMI CRC differences without failing"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Attempt push
        run: |
          echo "Generated commit: $GENERATED_COMMIT"
          git push origin HEAD:fix/pixel-a9-public-kmi-diagnostic-result
