name: Patch Pixel A9 public KMI-6 diagnostic mode

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'test/pixel-a9-public-kmi6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/pixel-a9-public-kmi6
          fetch-depth: 0
      - name: Apply focused workflow patch
        run: |
          python3 .github/scripts/patch-pixel-a9-public-kmi6.py
          git diff --check
          git diff -- .github/workflows/build.yml .github/workflows/kernel-a16-6-12-pixel-a9.yml
      - name: Create cleaned commit
        run: |
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          rm -f .github/scripts/patch-pixel-a9-public-kmi6.py
          rm -f .github/workflows/patch-pixel-a9-public-kmi6.yml
          git add .github/workflows/build.yml .github/workflows/kernel-a16-6-12-pixel-a9.yml .github/scripts/patch-pixel-a9-public-kmi6.py .github/workflows/patch-pixel-a9-public-kmi6.yml
          git commit -m "test: add Pixel A9 public KMI-6 diagnostic mode"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Attempt push
        run: |
          echo "Generated commit: $GENERATED_COMMIT"
          git push origin HEAD:test/pixel-a9-public-kmi6
