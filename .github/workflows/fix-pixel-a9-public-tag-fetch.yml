name: Fix Pixel A9 public tag fetch

on:
  push:
    branches:
      - test/pixel-a9-public-kmi6
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    # One-shot helper for PR #12; it removes itself in the generated commit.
    if: github.head_ref == 'test/pixel-a9-public-kmi6' || github.ref == 'refs/heads/test/pixel-a9-public-kmi6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/pixel-a9-public-kmi6
          fetch-depth: 0
      - name: Apply focused fetch fix
        run: |
          python3 .github/scripts/fix-pixel-a9-public-tag-fetch.py
          git diff --check
          git diff -- .github/workflows/build.yml
      - name: Create cleaned commit
        run: |
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          rm -f .github/scripts/fix-pixel-a9-public-tag-fetch.py
          rm -f .github/workflows/fix-pixel-a9-public-tag-fetch.yml
          git add .github/workflows/build.yml .github/scripts/fix-pixel-a9-public-tag-fetch.py .github/workflows/fix-pixel-a9-public-tag-fetch.yml
          git commit -m "test: fetch public Pixel A9 KMI tag from canonical AOSP remote"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Attempt push
        run: |
          echo "Generated commit: $GENERATED_COMMIT"
          git push origin HEAD:test/pixel-a9-public-kmi6
