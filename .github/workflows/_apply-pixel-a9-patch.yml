name: Apply Pixel A9 workflow patch

on:
  push:
    branches:
      - fix/pixel-a9-production-snapshot

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pixel-a9-production-snapshot
          fetch-depth: 0
      - name: Apply production compatibility patch
        run: python3 .github/scripts/apply_pixel_a9_workflow_patch.py
      - name: Remove one-shot helper
        run: |
          rm -f .github/workflows/_apply-pixel-a9-patch.yml
          rm -f .github/scripts/apply_pixel_a9_workflow_patch.py
      - name: Commit patched workflow
        run: |
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          git add .github/workflows/build.yml .github/workflows/_apply-pixel-a9-patch.yml .github/scripts/apply_pixel_a9_workflow_patch.py
          git commit -m "build: add Pixel A9 production snapshot compatibility"
          git push origin HEAD:fix/pixel-a9-production-snapshot
