name: Apply Android 16 KMI fix

on:
  push:
    branches:
      - fix/android16-kmi-generation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/android16-kmi-generation
          fetch-depth: 0

      - name: Apply minimal workflow patch
        run: |
          python3 .github/apply_android16_kmi_fix.py
          git diff --check
          git diff -- .github/workflows/build.yml

      - name: Commit patch and remove temporary helper files
        run: |
          rm .github/workflows/apply-android16-kmi-fix.yml
          rm .github/apply_android16_kmi_fix.py
          rm -f .github/kmi-patch-trigger
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "build: derive Android 16 KMI generation from AOSP source"
          git push origin HEAD:fix/android16-kmi-generation
