name: Apply Android 16 KMI fix

on:
  push:
    branches:
      - fix/android16-kmi-generation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/android16-kmi-generation
          fetch-depth: 0

      - name: Apply minimal workflow patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          s = path.read_text()

          # 1) Detect Android 16 / 6.12 KMI generation directly from AOSP.
          anchor = '''          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast
          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV
'''
          insert = anchor + '''
      # ==================== 检测 AOSP KMI Generation ====================
      # Android 16 / 6.12 的 KMI generation 由实际同步的 AOSP 源码决定，
      # 避免工作流中的硬编码 generation 与 vendor modules 的 KMI 不一致。
      - name: 检测 AOSP KMI Generation
        if: inputs.android_version == 'android16' && inputs.kernel_version == '6.12'
        working-directory: ${{ env.KERNEL_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          CONSTANTS="common/build.config.constants"
          if [ ! -f "$CONSTANTS" ]; then
            echo "::error::找不到 $CONSTANTS，无法确定 KMI generation"
            exit 1
          fi

          AOSP_BRANCH="$(sed -n 's/^BRANCH=//p' "$CONSTANTS" | head -n1)"
          KMI_GENERATION="$(sed -n 's/^KMI_GENERATION=//p' "$CONSTANTS" | head -n1)"
          CLANG_VERSION="$(sed -n 's/^CLANG_VERSION=//p' "$CONSTANTS" | head -n1)"

          if [ -z "$AOSP_BRANCH" ] || [ -z "$KMI_GENERATION" ]; then
            echo "::error::无法从 $CONSTANTS 读取 BRANCH/KMI_GENERATION"
            exit 1
          fi

          ANDROID_RELEASE="${AOSP_BRANCH%%-*}"
          KMI_TAG="${ANDROID_RELEASE}-${KMI_GENERATION}"

          echo "AOSP branch    : $AOSP_BRANCH"
          echo "KMI generation : $KMI_GENERATION"
          echo "KMI tag        : $KMI_TAG"
          echo "Clang version  : ${CLANG_VERSION:-unknown}"

          {
            echo "AOSP_BRANCH=$AOSP_BRANCH"
            echo "KMI_GENERATION=$KMI_GENERATION"
            echo "KMI_TAG=$KMI_TAG"
          } >> "$GITHUB_ENV"
'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one source-sync anchor, found {s.count(anchor)}')
          s = s.replace(anchor, insert, 1)

          # 2) Stop forcing Android 16 / 6.12 to stale generation 5.
          old = '              "android16-6.12") KMI_TAG="android16-5" ;;'
          new = '              "android16-6.12") KMI_TAG="${KMI_TAG:?KMI_TAG was not detected from AOSP source}" ;;'
          if s.count(old) != 2:
              raise SystemExit(f'expected two android16-5 KMI mappings, found {s.count(old)}')
          s = s.replace(old, new)

          # 3) Keep KMI/ABI enforcement for clean diagnostic builds.
          old = '''            # 配置 6.1+ 内核
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
            sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
            rm -rf ./common/android/abi_gki_protected_exports_*
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
'''
          new = '''            # 配置 6.1+ 内核
            # 清洁构建保留 GKI KMI/ABI 检查，使其可作为 vendor module 兼容性基准。
            if [ "${{ inputs.clean_build }}" != "true" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
              sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
              rm -rf ./common/android/abi_gki_protected_exports_*
            fi
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one ABI enforcement block, found {s.count(old)}')
          s = s.replace(old, new, 1)

          strict = "            sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64\n"
          strict_new = '''            if [ "${{ inputs.clean_build }}" != "true" ]; then
              sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64
            fi
'''
          if s.count(strict) != 2:
              raise SystemExit(f'expected two strict-mode removals, found {s.count(strict)}')
          s = s.replace(strict, strict_new)

          # 4) Verify the produced Image advertises the KMI generation that was
          # detected from the AOSP source. This catches future stale rewrites.
          anchor = '''            echo "构建完成: $BUILD_VARIANT"

      # ==================== 准备内核 Image ====================
'''
          insert = '''            echo "构建完成: $BUILD_VARIANT"

      # ==================== 验证 Android 16 KMI ====================
      - name: 验证 Android 16 KMI
        if: inputs.android_version == 'android16' && inputs.kernel_version == '6.12'
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image"
          if [ ! -f "$IMAGE" ]; then
            echo "::error::找不到构建产物: $IMAGE"
            exit 1
          fi

          VERSION="$(strings "$IMAGE" | grep -m1 'Linux version')"
          echo "$VERSION"

          if [ -z "${KMI_GENERATION:-}" ]; then
            echo "::error::KMI_GENERATION 未设置"
            exit 1
          fi

          if ! grep -q -- "-android16-${KMI_GENERATION}" <<< "$VERSION"; then
            echo "::error::Kernel release 与 AOSP KMI generation 不一致；期望 android16-${KMI_GENERATION}"
            exit 1
          fi

      # ==================== 准备内核 Image ====================
'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one post-build anchor, found {s.count(anchor)}')
          s = s.replace(anchor, insert, 1)

          if 'android16-5' in s:
              raise SystemExit('stale android16-5 string still present after patch')

          path.write_text(s)
          PY

          git diff --check
          git diff -- .github/workflows/build.yml

      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-android16-kmi-fix.yml
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          git add .github/workflows/build.yml .github/workflows/apply-android16-kmi-fix.yml
          git commit -m "build: derive Android 16 KMI generation from AOSP source"
          git push origin HEAD:fix/android16-kmi-generation
