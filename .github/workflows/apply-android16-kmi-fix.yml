name: Apply Android 16 KMI workflow fix

on:
  push:
    branches:
      - fix/android16-kmi-generation

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: fix/android16-kmi-generation
          fetch-depth: 0

      - name: Patch shared build workflow
        run: python3 .github/scripts/apply_android16_kmi_fix.py

      - name: Commit patched workflow and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-android16-kmi-fix.yml
          git rm .github/scripts/apply_android16_kmi_fix.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml
          git commit -m "build: derive Android 16 KMI generation from AOSP source"
          git push origin HEAD:fix/android16-kmi-generation
