name: Apply Pixel A9 stamp fix on main
on:
  push:
    branches: [fix/pixel-a9-kleaf-stamp-main]
    paths: [.github/workflows/_apply-pixel-a9-stamp-main.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pixel-a9-kleaf-stamp-main
          fetch-depth: 0
      - run: python3 .github/scripts/apply_pixel_a9_stamp_fix.py
      - run: |
          rm -f .github/workflows/_apply-pixel-a9-stamp-main.yml
          rm -f .github/scripts/apply_pixel_a9_stamp_fix.py
      - run: |
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          git add .github/workflows/build.yml .github/workflows/_apply-pixel-a9-stamp-main.yml .github/scripts/apply_pixel_a9_stamp_fix.py
          git commit -m "build: enable Kleaf stamping for Pixel A9 compatibility"
          git push origin HEAD:fix/pixel-a9-kleaf-stamp-main
