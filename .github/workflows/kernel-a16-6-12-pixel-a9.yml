name: Pixel 11 A9 production-compatible GKI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean diagnostic build (recommended for the first test)"
        required: false
        type: boolean
        default: true
      kernelsu_branch:
        description: "ReSukiSU branch/commit (used when clean_build=false)"
        required: false
        type: string
        default: ""
      enable_susfs:
        description: "Enable SUSFS (test only after clean/ReSukiSU-only builds pass)"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: true
      pin_production_snapshot:
        description: "Pin exact A9 production snapshot; disable for public KMI-generation experiment"
        required: false
        type: boolean
        default: true
      public_kmi_tag:
        description: "Public kernel/common tag when production pin is disabled"
        required: false
        type: string
        default: "android16-6.12-2026-03_r52"
      inject_stock_gki_cert:
        description: "Inject Pixel A9 stock GKI certificate into trusted keys"
        required: false
        type: boolean
        default: true

jobs:
  pixel-a9:
    name: "6.12.69-Pixel-A9-${{ inputs.clean_build && 'Clean' || 'ReSukiSU' }}"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: android16
      kernel_version: "6.12"
      sub_level: "69"
      os_patch_level: "2026-03"
      revision: "pixel-a9"
      clean_build: ${{ inputs.clean_build }}
      ksu_variant: ${{ inputs.clean_build && 'Clean' || 'ReSukiSU' }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ""
      build_time: "Fri Jul 10 21:44:24 UTC 2026"
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      enable_susfs: ${{ !inputs.clean_build && inputs.enable_susfs }}
      supp_op: false
      droidspaces: "off"
      droidspaces_ntsync: false
      build_bypass: false
      image_only_compat: false
      build_matching_system_dlkm: false
      pixel_a9_compat: true
      pixel_a9_pin_production_snapshot: ${{ inputs.pin_production_snapshot }}
      pixel_a9_public_tag: ${{ inputs.public_kmi_tag }}
      pixel_a9_inject_stock_cert: ${{ inputs.inject_stock_gki_cert }}
