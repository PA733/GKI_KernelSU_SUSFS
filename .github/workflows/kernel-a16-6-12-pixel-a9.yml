name: Pixel 11 GKI from stock OTA

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      device:
        description: Pixel 设备型号
        type: choice
        default: Pixel 11 Pro XL / kodiak
        options:
          - Pixel 11 / cubs
          - Pixel 11 Pro / grizzly
          - Pixel 11 Pro XL / kodiak
          - Pixel 11 Pro Fold / yogi
      firmware_build:
        description: "固件 Build ID（留空使用最新全球稳定版，地区版本请填写完整 ID）"
        type: string
        default: ""
      clean_build:
        description: "Clean diagnostic build (recommended for the first test)"
        required: false
        type: boolean
        default: true
      kernelsu_branch:
        description: "ReSukiSU branch/commit (used when clean_build=false)"
        required: false
        type: string
        default: ""
      enable_susfs:
        description: "Enable SUSFS (test only after clean/ReSukiSU-only builds pass)"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "构建 LZ4KD 模块（须配套更新 vendor_kernel_boot，4 KiB 页）"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: true
      inject_stock_gki_cert:
        description: "Inject Pixel A9 stock GKI certificate into trusted keys"
        required: false
        type: boolean
        default: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target: ${{ steps.stock.outputs.target }}
      sub_level: ${{ steps.stock.outputs.sub_level }}
      patch_month: ${{ steps.stock.outputs.patch_month }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install OTA extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y erofs-utils e2fsprogs lz4 zstd python3-pyelftools
          go install github.com/xishang0128/payload-dumper-go/cmd/payload-dumper@v0.1.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Read stock kernel and module baselines
        id: stock
        env:
          MODEL: ${{ inputs.device }}
          FIRMWARE_BUILD: ${{ inputs.firmware_build }}
        run: |
          /usr/bin/python3 scripts/pixel_ota.py "${MODEL##* }" --build "$FIRMWARE_BUILD" \
            --work "$RUNNER_TEMP/firmware" --output stock-profile --github-output "$GITHUB_OUTPUT"
          jq -r '"Device: \(.device) · Firmware: \(.build) · Kernel: \(.release) · Sources: \(.source)"' \
            stock-profile/profile.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: pixel-stock-${{ steps.stock.outputs.target }}
          path: stock-profile/
          if-no-files-found: error
  pixel-a9:
    needs: firmware
    name: "${{ needs.firmware.outputs.target }}-${{ inputs.clean_build && 'Clean' || 'ReSukiSU' }}"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: android16
      kernel_version: "6.12"
      sub_level: ${{ needs.firmware.outputs.sub_level }}
      os_patch_level: ${{ needs.firmware.outputs.patch_month }}
      revision: ${{ needs.firmware.outputs.target }}
      pixel_profile: pixel-stock-${{ needs.firmware.outputs.target }}
      clean_build: ${{ inputs.clean_build }}
      ksu_variant: ${{ inputs.clean_build && 'Clean' || 'ReSukiSU' }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ""
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      enable_susfs: ${{ !inputs.clean_build && inputs.enable_susfs }}
      supp_op: false
      droidspaces: "off"
      droidspaces_ntsync: false
      build_bypass: false
      image_only_compat: false
      build_matching_system_dlkm: false
      pixel_a9_compat: true
      pixel_a9_inject_stock_cert: ${{ inputs.inject_stock_gki_cert }}
