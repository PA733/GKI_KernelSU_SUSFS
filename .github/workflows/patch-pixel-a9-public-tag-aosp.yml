name: Patch Pixel A9 public tag AOSP remote

on:
  push:
    branches:
      - fix/pixel-a9-public-tag-aosp-remote
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/pixel-a9-public-tag-aosp-remote' || github.ref == 'refs/heads/fix/pixel-a9-public-tag-aosp-remote'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pixel-a9-public-tag-aosp-remote
          fetch-depth: 0
      - name: Apply focused checkout fix
        run: |
          python3 .github/scripts/patch-pixel-a9-public-tag-aosp.py
          git diff --check
          git diff -- .github/workflows/build.yml
      - name: Create cleaned commit
        run: |
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          rm -f .github/scripts/patch-pixel-a9-public-tag-aosp.py
          rm -f .github/workflows/patch-pixel-a9-public-tag-aosp.yml
          git add .github/workflows/build.yml .github/scripts/patch-pixel-a9-public-tag-aosp.py .github/workflows/patch-pixel-a9-public-tag-aosp.yml
          git commit -m "test: use repo-managed AOSP remote for public KMI tag"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Attempt push
        run: |
          echo "Generated commit: $GENERATED_COMMIT"
          git push origin HEAD:fix/pixel-a9-public-tag-aosp-remote
