name: Launch Pixel clean build check
on:
  push:
    branches: [test/dispatch-pixel-ota-clean]
permissions:
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run the Pixel build with the default device and latest global OTA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run kernel-a16-6-12-pixel-a9.yml --ref feat/pixel-ota-build
