name: Apply Pixel A9 normal clean SCM stamp fix
on:
  push:
    branches:
      - fix/pixel-a9-normal-clean-stamp
    paths:
      - .github/workflows/_apply-pixel-a9-normal-clean-stamp.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pixel-a9-normal-clean-stamp
          fetch-depth: 0
      - name: Apply normal clean stamp fix
        run: python3 .github/scripts/apply_pixel_a9_normal_clean_stamp.py
      - name: Remove one-shot helper
        run: |
          rm -f .github/workflows/_apply-pixel-a9-normal-clean-stamp.yml
          rm -f .github/scripts/apply_pixel_a9_normal_clean_stamp.py
      - name: Commit generated workflow
        run: |
          git config user.name "PA733 CI patch helper"
          git config user.email "actions@github.com"
          git add .github/workflows/build.yml .github/workflows/_apply-pixel-a9-normal-clean-stamp.yml .github/scripts/apply_pixel_a9_normal_clean_stamp.py
          git commit -m "build: clean Pixel A9 SCM stamp in normal build"
          git push origin HEAD:fix/pixel-a9-normal-clean-stamp
